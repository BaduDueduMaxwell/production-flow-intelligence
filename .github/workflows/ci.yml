name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip

      - name: Compile Python modules
        run: python -m compileall -q python tests

      - name: Validate workflow JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('n8n/workflows').glob('*.json'):
              json.loads(path.read_text())
              print(f'valid JSON: {path}')
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check SQL files are non-empty
        run: |
          test -n "$(find bigquery -type f -name '*.sql' -size +0c -print -quit)"

      - name: Check public documentation boundary
        run: |
          test "$(git ls-files '*.md' | wc -l | tr -d ' ')" = "1"
          test "$(git ls-files '*.md')" = "README.md"

      - name: Check runtime files are not tracked
        run: |
          ! git ls-files | grep -E '(^|/)(n8n/data/|.*\.sqlite(-.*)?$|.*\.log$|\.env$|__pycache__/|.*\.pyc$)'

      - name: Scan tracked source for obvious secrets
        run: |
          ! git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}' -- ':!README.md'

      - name: Check README references required setup assets
        run: |
          grep -F 'n8n/workflows/ingest-events-local.json' README.md
          grep -F 'n8n/workflows/ingest-events.json' README.md
          grep -F 'n8n/workflows/detect-delays.json' README.md
          grep -F 'v_dashboard_overview' README.md
          grep -F 'v_data_quality_overview' README.md
          grep -F 'v_data_quality_detail' README.md
          grep -F 'v_delayed_orders' README.md
