name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile Python modules
        run: python -m compileall -q python tests

      - name: Validate workflow JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('n8n/workflows').glob('*.json'):
              json.loads(path.read_text())
              print(f'valid JSON: {path}')
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Check SQL files are non-empty
        run: |
          test -n "$(find bigquery -type f -name '*.sql' -size +0c -print -quit)"
